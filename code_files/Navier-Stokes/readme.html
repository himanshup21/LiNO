<p class="p1">## Running</p>
<p class="p2"><br></p>
<p class="p1">Execute the training script:</p>
<p class="p2"><br></p>
<p class="p1">```bash</p>
<p class="p1">bash run.sh</p>
<p class="p1">```</p>
<p class="p2"><br></p>
<p class="p1">If you encounter a permission error:</p>
<p class="p2"><br></p>
<p class="p1">```bash</p>
<p class="p1">chmod +x run.sh</p>
<p class="p1">./run.sh</p>
<p class="p1">```</p>
<p class="p2"><br></p>
<p class="p1">Training logs are automatically saved in the `logs/` directory.</p>
